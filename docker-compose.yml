services:
  app:
    container_name: bobby-holidays-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Compose environment}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bobby-network
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  mysql:
    image: mysql:8.4
    container_name: bobby-holidays-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the Compose environment}
      MYSQL_DATABASE: ${DB_DATABASE:-bobby_holidays}
      MYSQL_USER: ${DB_USERNAME:-bobby_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Compose environment}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/backups/bobby-holidays-bootstrap.sql:/docker-entrypoint-initdb.d/001-bobby-holidays-bootstrap.sql:ro
    networks:
      - bobby-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bobby-holidays-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Compose environment}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Compose environment}
    volumes:
      - redis_data:/data
    networks:
      - bobby-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  bobby-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
